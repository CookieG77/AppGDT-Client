{{define "base"}}<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{if .Title}}{{.Title}} · {{end}}GDT</title>
    <meta name="description" content="{{if .Description}}{{.Description}}{{else}}GDT, votre carnet de notes en ligne : organisez vos notes par espaces et suivez leur avancement.{{end}}">
    <meta name="theme-color" content="#f6f0e3">
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/static/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    {{template "header" .}}
    <main id="contenu" class="site-main" tabindex="-1">
        <div class="container">
            {{with .Breadcrumb}}{{template "breadcrumb" .}}{{end}}
            {{template "flash" .}}
            {{template "content" .}}
        </div>
    </main>
    {{template "footer" .}}
    {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
